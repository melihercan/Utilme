name: Publish Utilme.Result

# Two ways in:
#   * push a tag like "result-v26.09.07" — builds, tests, packs and pushes to NuGet
#   * run manually — defaults to a dry run that packs and uploads the .nupkg as a
#     build artifact without publishing anything
on:
  push:
    tags: ['result-v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Pack only, do not push to NuGet'
        type: boolean
        default: true

concurrency:
  group: publish-result
  cancel-in-progress: false

env:
  PROJECT: Result/Result.csproj
  TAG_PREFIX: result-v

jobs:
  publish:
    name: Pack and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # Catches the classic release bug: tagging one version while the csproj
      # still says another.
      - name: Verify the tag matches the project version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          version=$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' "$PROJECT" | head -1)
          tag="${GITHUB_REF_NAME#$TAG_PREFIX}"
          echo "csproj <Version>: $version"
          echo "tag version:      $tag"
          if [ "$version" != "$tag" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match <Version>$version</Version> in $PROJECT"
            exit 1
          fi

      - name: Restore
        run: dotnet restore Utilme.sln

      - name: Build
        run: dotnet build Utilme.sln --configuration Release --no-restore -warnaserror

      # Never publish a package whose tests do not pass.
      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: |
          dotnet pack "$PROJECT" \
            --configuration Release \
            --output artifacts \
            -p:ContinuousIntegrationBuild=true

      - name: Show package contents
        run: |
          for pkg in artifacts/*.nupkg; do
            echo "== $pkg"
            unzip -l "$pkg"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: Utilme.Result-nupkg
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: Check the NuGet API key is configured
        if: github.event_name == 'push' || inputs.dry-run == false
        run: |
          if [ -z "${{ secrets.NUGET_API_KEY }}" ]; then
            echo "::error::Repository secret NUGET_API_KEY is not set."
            exit 1
          fi

      # --skip-duplicate makes a re-run harmless if the version is already published.
      - name: Push to NuGet
        if: github.event_name == 'push' || inputs.dry-run == false
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Dry run summary
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run
        run: echo "::notice::Dry run - package built and uploaded as an artifact, nothing published."
